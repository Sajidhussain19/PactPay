<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #444; }
  .box { border: 2px dashed #999; border-radius: 8px; display: flex; align-items: center;
         justify-content: center; font-weight: 600; }
  .hero { height: 260px; margin: 0; border-left: 0; border-right: 0; border-top: 0;
          flex-direction: column; gap: 8px; background: #f2f2f2; }
  .grid { max-width: 960px; margin: 24px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .col { height: 360px; flex-direction: column; gap: 12px; }
  .line { width: 70%; height: 14px; background: #ddd; border-radius: 4px; }
  .field { width: 80%; height: 32px; border: 2px solid #ccc; border-radius: 6px; }
  .btn { width: 80%; height: 40px; background: #888; border-radius: 6px; color: #fff;
         display: flex; align-items: center; justify-content: center; }
  footer { height: 60px; margin: 0 auto; max-width: 960px; }
</style></head><body>
  <div class="box hero"><div style="font-size:40px">BAKERY NAME</div><div>Tagline</div>
    <div class="btn" style="width:160px">CTA button</div></div>
  <div class="grid">
    <div class="box col">MENU<div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
    <div class="box col">CONTACT FORM<div class="field"></div><div class="field"></div><div class="field" style="height:80px"></div><div class="btn">Send</div></div>
  </div>
  <div class="box" style="height:60px;max-width:960px;margin:0 auto 24px">FOOTER</div>
</body></html>

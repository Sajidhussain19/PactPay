# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo. Everything is on the FREE plan.
# The demo uses SQLite inside the API container: no database to pay for or expire. Data resets
# when the free instance restarts (after ~15 min idle) and the demo contract is re-seeded.
# Secrets marked `sync: false` are entered in the Render dashboard (never committed).
# If a service name is taken, Render gives a different URL: update BACKEND_URL,
# FRONTEND_URL, CORS_ORIGINS and NEXT_PUBLIC_API_URL to match.

services:
  - type: web
    name: pactpay-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////app/data/pactpay.db
      - key: DATABASE_AUTO_CREATE
        value: "false" # migrations run on start (alembic upgrade head)
      # Fit headless Chromium in the free tier's 512 MB: one check and one run at a time.
      - key: LOW_MEMORY_BROWSER
        value: "true"
      - key: VERIFICATION_PARALLEL_CHECKS
        value: "1"
      - key: VERIFICATION_CONCURRENT_RUNS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false # create the webhook after the first deploy, then set this
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_FREELANCER_PAYPAL_EMAIL
        sync: false # a US sandbox personal account
      - key: BACKEND_URL
        value: https://pactpay-api.onrender.com
      - key: FRONTEND_URL
        value: https://pactpay-web.onrender.com
      - key: CORS_ORIGINS
        value: '["https://pactpay-web.onrender.com"]'
      - key: AUTO_APPROVE_HOURS
        value: "48"

  - type: web
    name: pactpay-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://pactpay-api.onrender.com

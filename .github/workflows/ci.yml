name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright checks
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  evals:
    # Verifier trust gate: fail the build if defective or manipulated deliveries would be
    # auto-paid more than 5% of the time. Rules judge: free, deterministic, no API key.
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run verifier evals (false-pass gate 5%)
        run: python -m evals.run_evals --judge rules --max-false-pass 0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            backend/evals/report-rules.md
            backend/evals/out/results-rules.json

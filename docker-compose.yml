services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pactpay
      POSTGRES_PASSWORD: pactpay
      POSTGRES_DB: pactpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pactpay"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pactpay:pactpay@db:5432/pactpay
      DATABASE_AUTO_CREATE: "false"
      BACKEND_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
